<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModVC Node.js Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff6e9;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      width: min(90%, 420px);
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 { margin-top: 0; }
    p { color: #666; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 12px 0;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #6748ef; }

    #status {
      margin-top: 14px;
      color: #555;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🧪 Node.js Server Test</h1>
    <p>Type something and send it to the server console.</p>

    <input id="messageInput" type="text" placeholder="Type a message..." />

    <button id="sendButton">Send to Server</button>

    <div id="status">Status: Ready</div>
  </main>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) {
        status.textContent = "Please type a message first.";
        return;
      }

      status.textContent = "Sending...";

      try {
        const response = await fetch("/message", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        status.textContent = "Server received: " + data.message;
        input.value = "";
      } catch (error) {
        status.textContent =
          "Could not reach the server. Check that server.js is running.";
        console.error(error);
      }
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
