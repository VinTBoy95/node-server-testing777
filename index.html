<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echo Test</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    input { padding: 12px; font-size: 16px; width: 300px; border-radius: 6px; border: none; }
  </style>
</head>
<body>
  <input id="box" placeholder="Type here, check server console..." autocomplete="off">
  <script>
    const box = document.getElementById('box');
    box.addEventListener('input', () => {
      fetch('/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: box.value })
      });
    });
  </script>
</body>
</html>
